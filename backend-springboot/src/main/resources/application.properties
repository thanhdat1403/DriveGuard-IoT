
# ==========================================
# DRIVEGUARD IOT - SPRING BOOT CONFIGURATION
# ==========================================

# Ten ung dung
spring.application.name=driveguard-backend

# Cong chay Spring Boot
server.port=8081

# ==========================================
# DATABASE - MARIADB
# ==========================================

# MariaDB Docker dang chay tren cong 3308
# DRIVEGUARD - DATABASE
spring.datasource.url=${DRIVEGUARD_DB_URL:jdbc:mariadb://localhost:3308/driveguard_db}
spring.datasource.username=${DRIVEGUARD_DB_USERNAME}
spring.datasource.password=${DRIVEGUARD_DB_PASSWORD}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Khong tu dong thay doi cau truc database
spring.jpa.hibernate.ddl-auto=validate

# Khong hien thi SQL trong console
spring.jpa.show-sql=false

# ==========================================
# DEVELOPMENT
# ==========================================

spring.devtools.restart.enabled=true

# Quy uoc JDBC/Hibernate su dung UTC
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.open-in-view=false


# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=driveguard-backend
app.jwt.audience=driveguard-frontend

# ==========================================
# MQTT - MOSQUITTO DOCKER
# ==========================================

driveguard.mqtt.broker-url=${DRIVEGUARD_MQTT_URL:tcp://localhost:1883}

driveguard.mqtt.telemetry-topic=driveguard/demo/esp32s3/telemetry

driveguard.mqtt.events-topic=driveguard/demo/esp32s3/events

# Enable MQTT subscriber in normal application runtime
driveguard.mqtt.enabled=${DRIVEGUARD_MQTT_ENABLED:true}