
# ==========================================
# DRIVEGUARD IOT - SPRING BOOT CONFIGURATION
# ==========================================

# Ten ung dung
spring.application.name=driveguard-backend

# Cong chay Spring Boot
server.port=8081

# ==========================================
# DATABASE - MARIADB
# ==========================================

# MariaDB Docker dang chay tren cong 3308
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3308/driveguard_db}

# Thong tin dang nhap lay tu bien moi truong
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Khong tu dong thay doi cau truc database
spring.jpa.hibernate.ddl-auto=validate

# Khong hien thi SQL trong console
spring.jpa.show-sql=false

# ==========================================
# DEVELOPMENT
# ==========================================

spring.devtools.restart.enabled=true


# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=driveguard-backend
app.jwt.audience=driveguard-frontend