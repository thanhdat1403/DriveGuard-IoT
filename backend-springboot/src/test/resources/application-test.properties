
# ==========================================
# DRIVEGUARD V9 - TEST ENVIRONMENT
# ==========================================

spring.application.name=driveguard-backend-test

# Disable MQTT subscriber during tests
driveguard.mqtt.enabled=false

# ==========================================
# ISOLATED TEST DATABASE
# ==========================================

spring.datasource.url=${DRIVEGUARD_TEST_DB_URL}
spring.datasource.username=${DRIVEGUARD_TEST_DB_USERNAME}
spring.datasource.password=${DRIVEGUARD_TEST_DB_PASSWORD}

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Validate schema without modifying it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# TEST JWT
# ==========================================

app.jwt.secret=${DRIVEGUARD_TEST_JWT_SECRET}
