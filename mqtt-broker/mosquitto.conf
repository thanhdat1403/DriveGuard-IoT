
persistence true
persistence_location /mosquitto/data/

log_dest stdout

listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

# Hai cổng có chức năng khác nhau:
# 1883: Cổng mặc định cho giao thức MQTT, được sử dụng để kết nối từ các client MQTT, dành cho thiết bị IoT hoặc chương trình MQTT thông thường.
# 9001: Cổng dành cho Frontend React kết nối qua WebSocket.